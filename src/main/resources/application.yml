spring:
  application:
    name: anomaly-detection
  web:
    resources:
      add-mappings: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  error:
    include-message: never
    include-stacktrace: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
