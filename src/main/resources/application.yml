spring:
  application:
    name: anomaly-detection
  web:
    resources:
      add-mappings: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    max-swallow-size: ${DETECTION_LIMITS_MAX_BODY_BYTES:67108864}
  error:
    include-message: never
    include-stacktrace: never
spring.lifecycle.timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
