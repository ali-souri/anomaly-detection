services:
  app:
    ports: !reset []
    cpus: ${APP_CPUS:-4}
  proxy:
    image: nginx:1.28.0-alpine3.21
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./load-tests/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    cpus: ${PROXY_CPUS:-0.25}
    mem_limit: 128m
    memswap_limit: 128m
    stop_grace_period: 25s
