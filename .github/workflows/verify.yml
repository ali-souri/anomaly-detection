name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify documented convenience commands
        run: |
          ./mvnw -B spotless:check
          ./mvnw -B test
          ./mvnw -B test-compile failsafe:integration-test failsafe:verify
          ./mvnw -B javadoc:javadoc
          ./mvnw -B spotless:apply
          git diff --exit-code
      - name: Clean combined coverage quality gate
        run: ./mvnw -B clean verify
      - name: Verify separate candidate benchmark and load tooling
        run: |
          ./mvnw -B org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file -Dfile=target/anomaly-detection-0.3.0-SNAPSHOT.jar.original -DgroupId=io.anomaly -DartifactId=anomaly-detection -Dversion=0.3.0-SNAPSHOT -Dclassifier=benchmark-candidate -Dpackaging=jar -DgeneratePom=true
          ./mvnw -B -f benchmarks/pom.xml -Ddetector.version=0.3.0-SNAPSHOT -Ddetector.classifier=benchmark-candidate clean verify
          node --test load-tests/contract.test.mjs
          python -B scripts/test_summarize_load.py
          python -B scripts/test_analyze008.py
          python -B scripts/test_report008.py
          python -B scripts/test_analyze009.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/reports/apidocs
            target/site/jacoco
            target/jacoco.exec
            benchmarks/target/surefire-reports
            benchmarks/target/reports/apidocs
